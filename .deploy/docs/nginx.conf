# Static serving for the Docusaurus build. Clean URLs: Docusaurus emits a directory
# per route with an index.html, plus a generated 404.html.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache the fingerprinted assets; never cache HTML so deploys show through.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # A 404 must never be cached, by the edge or the browser. While a deploy rolls, the
    # old pod still answers some requests and has none of the new build's hashed files
    # (/assets/js/runtime~main.<hash>.js): without a Cache-Control header, Cloudflare
    # kept that 404 at the edge and gave it to browsers with max-age=14400, so the page
    # did not hydrate for up to 4 h after a deploy. `always` is needed: add_header
    # skips error responses otherwise.
    error_page 404 /404.html;
    location = /404.html {
        add_header Cache-Control "no-store" always;
    }

    # k8s probe target.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
