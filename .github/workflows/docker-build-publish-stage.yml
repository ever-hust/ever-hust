name: Build and Publish Hust Web Image (Stage)

# Builds the Next.js web app container and pushes it to GHCR
# (ghcr.io/ever-hust/hust-web:stage), which the k8s-gauzy cluster pulls for the
# stage environment. Mirrors the prod build but for the `stage` branch — only
# public NEXT_PUBLIC_* are baked in; server secrets are injected by k8s at runtime.
on:
  push:
    branches: [stage]
    paths:
      - "apps/**"
      - "packages/**"
      - ".deploy/web/**"
      - ".github/workflows/docker-build-publish-stage.yml"
      - "pnpm-lock.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

# docker/build-push-action uploads a build record artifact and a job summary for every build.
# The record holds every build-arg value in plain text, and on a public repo anyone signed in to
# GitHub can download it, so neither is produced. (BuildKit `secrets:` are never recorded.)
env:
  DOCKER_BUILD_RECORD_UPLOAD: false
  DOCKER_BUILD_SUMMARY: false

jobs:
  build-web:
    runs-on: ${{ vars.RUNNER_LINUX_X64_8 || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Materialise build-time NEXT_PUBLIC_* env
        env:
          HUST_STAGE_ENV: ${{ secrets.HUST_STAGE_ENV }}
        run: |
          printf '%s' "$HUST_STAGE_ENV" > /tmp/hust.env
          # Export only the NEXT_PUBLIC_* lines (the build args Next inlines).
          # GitHub masks the HUST_STAGE_ENV blob as a whole, but NOT the individual
          # values we sieve out of it — so register each one with ::add-mask::
          # before it can reach the log. (A Maps key leaked this way from
          # 2026-06-15 until 2026-08-11.)
          grep -E '^NEXT_PUBLIC_' /tmp/hust.env > /tmp/hust.pub || true
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            printf '::add-mask::%s\n' "${line#*=}"
            printf '%s\n' "$line" >> "$GITHUB_ENV"
          done < /tmp/hust.pub
          rm -f /tmp/hust.env /tmp/hust.pub

      - name: Build and push (GHCR)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./.deploy/web/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/ever-hust/hust-web:stage
            ghcr.io/ever-hust/hust-web:stage-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/ever-hust/hust-web:latest
          cache-to: type=inline
          build-args: |
            NEXT_PUBLIC_APP_URL=https://appstage.hust.so
            NEXT_PUBLIC_DOCS_URL=https://docsstage.hust.so
            NEXT_PUBLIC_MARKETING_URL=https://stage.hust.so
            NEXT_PUBLIC_APP_NAME=${{ env.NEXT_PUBLIC_APP_NAME }}
            NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.HUST_MAPS_BROWSER_KEY }}
            # Error tracking + analytics. The Sentry DSN is a repo variable, not a literal: forks do not inherit
            # variables, so a fork's build cannot report into Ever's Sentry project.
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_POSTHOG_HOST=https://us.i.posthog.com
            # Pro / credit purchases in the app (apps/web/lib/payments.ts). OFF unless the repository
            # variable is exactly "true"; unset bakes as empty, which is OFF. Keep it off until Ever Hust has Stripe.
            NEXT_PUBLIC_HUST_PAYMENTS_ENABLED=${{ vars.NEXT_PUBLIC_HUST_PAYMENTS_ENABLED }}
            # PostHog project key — public phc_ key (Ever Hust project 525078), safe to inline
            # into the client bundle (same value across all envs).
            NEXT_PUBLIC_POSTHOG_KEY=phc_zy7MRvWMzTCSa9pwreMh72EfRHyRk9erTh6x6shu7EZY
